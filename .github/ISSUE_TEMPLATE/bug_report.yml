name: Bug report
description: Something in GameMate doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **never paste your Gemini API key**, and check the log before you paste it.
        Security problems go privately to the maintainer instead: see [SECURITY.md](https://github.com/TSCKey/gamemate/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: GameMate version
      description: Shown in ⚙ Settings → General → Updates.
      placeholder: 1.1.1
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: Which AI answered?
      options:
        - Built-in AI
        - Ollama
        - Gemini
        - Auto
        - Not about the AI
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version and graphics card
      placeholder: Windows 11 24H2, NVIDIA RTX 4050 Laptop
  - type: dropdown
    id: language
    attributes:
      label: GameMate's language
      options:
        - English
        - العربية (Arabic)
        - Français (French)
        - Deutsch (German)
        - Español (Spanish)
        - Português (Portuguese)
        - Italiano (Italian)
        - Türkçe (Turkish)
        - Русский (Russian)
        - 日本語 (Japanese)
        - 中文 (Chinese)
        - 한국어 (Korean)
  - type: input
    id: game
    attributes:
      label: Game
      description: The game you were playing or asking about, if any.
      placeholder: Minecraft 1.21
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open the in-game window with Alt + Space
        2. Ask "…"
        3. …
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: |
        The end of `%APPDATA%\gamemate\logs\main.log`. It doesn't contain your questions or answers, but remove anything you don't want to share.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send
      options:
        - label: This report contains no API key or other private information.
          required: true
