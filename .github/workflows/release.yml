# Builds the Windows installer and publishes it as a GitHub Release when a version tag (like
# v1.0.1) is pushed, so releases no longer need a personal token on a developer's PC. The tag
# must match the version in package.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json ($version)." && exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
