# Builds the Windows installer and publishes it as a GitHub Release when a version tag (like
# v1.0.2) is pushed, so releases don't need a personal token on a developer's PC. The tag must
# match the version in package.json, and the version's English patch notes
# (src/shared/patchNotes/<version>/en.md) become the release notes:
#   git tag -a v1.0.2 -m "GameMate 1.0.2" && git push origin v1.0.2
# It can also be run by hand (Actions → Release → Run workflow) to rebuild an existing tag's
# release, replacing its files.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build, e.g. v1.0.2'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "Tag $TAG doesn't match package.json ($version)." && exit 1
          fi
      - run: npm ci
      - run: npm test
      # Build only; the files are uploaded below in one step. (electron-builder's own publishing
      # uploads each file separately and lost the installer when they raced.)
      - run: npm run build
      - run: npx electron-builder --win --publish never
      # GameMate's eSpeak NG (GPL-3.0-or-later) is its own build (vendor/espeak-ng, checked against
      # its manifest by npm test above). Its complete source at the commit it was built from, and
      # the script that built it, are published beside the installer
      # (licenses/THIRD-PARTY-NOTICES.md points here).
      - name: Pack the eSpeak NG source and build script
        shell: bash
        run: |
          mkdir -p dist/sources
          commit=4870adfa25b1a32b4361592f1be8a40337c58d6c
          if [ "$(node -p "require('./vendor/espeak-ng/manifest.json').commit")" != "$commit" ]; then
            echo "vendor/espeak-ng was built from another commit." && exit 1
          fi
          curl -fsSL "https://github.com/espeak-ng/espeak-ng/archive/$commit.tar.gz" \
            -o dist/sources/espeak-ng-1.52.0-source.tar.gz
          tar -czf dist/sources/gamemate-espeak-build.tar.gz \
            scripts/espeak .github/workflows/espeak.yml vendor/espeak-ng/manifest.json
      - name: Publish the installer and update files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          files=(dist/GameMate-Setup-$version.exe dist/GameMate-Setup-$version.exe.blockmap dist/latest.yml dist/sources/espeak-ng-1.52.0-source.tar.gz dist/sources/gamemate-espeak-build.tar.gz)
          notes=src/shared/patchNotes/$version/en.md
          cat "$notes" .github/release-install-note.md > dist/release-notes.md
          ls -l "${files[@]}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" "${files[@]}" --title "GameMate $version" --notes-file dist/release-notes.md
          fi
