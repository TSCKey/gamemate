appId: com.gamemate.app
productName: GameMate
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# GameMate's interface is in English, so Chromium's other languages aren't needed.
electronLanguages:
  - en-US
asarUnpack:
  - resources/**
  # koffi's native binaries can't be loaded from inside the asar archive.
  - node_modules/koffi/**
win:
  executableName: GameMate
  target:
    - target: nsis
      arch: x64
nsis:
  # One click, installed for the current user: no admin prompt, so updates install quietly too.
  oneClick: true
  perMachine: false
  artifactName: GameMate-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Installers and update files are published as GitHub Releases; the app checks there for updates.
publish:
  provider: github
  owner: TSCKey
  repo: gamemate
  releaseType: release
